<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      href="/src/modules/content/assets/home/ArtShowcaseHeader.webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICAF — Inspiring Creativity &amp; Empathy in Children Through the Arts</title>
    <meta
      name="description"
      content="The International Child Art Foundation nurtures children's creativity and empathy through global art programs, festivals, and education. Discover how art changes lives."
    />
    <script>
      (function () {
        var measurementId = '%VITE_GA_MEASUREMENT_ID%';

        // Analytics is production-only. This hostname check also prevents a
        // production build viewed through a Pages alias from sending events.
        if (window.location.hostname !== 'icaf.org' || !measurementId) {
          return;
        }

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = window.gtag || gtag;

        gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500,
        });

        gtag('js', new Date());
        gtag('config', measurementId, {
          send_page_view: false,
          tag_for_child_directed_treatment: true,
        });

        var analyticsScript = document.createElement('script');
        analyticsScript.async = true;
        analyticsScript.src =
          'https://www.googletagmanager.com/gtag/js?id=' +
          encodeURIComponent(measurementId);
        document.head.appendChild(analyticsScript);
      })();
    </script>
    <meta name="theme-color" content="#0f4c81" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Keep in sync with src/utils/chunkLoadRecovery.ts.
        var RETRY_KEY = 'icaf:chunk-load-retried';

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            var isAssetScriptFailure =
              target &&
              target.tagName === 'SCRIPT' &&
              target.src &&
              target.src.indexOf('/assets/') !== -1;

            if (!isAssetScriptFailure) {
              return;
            }

            try {
              if (window.sessionStorage.getItem(RETRY_KEY) === 'true') {
                return;
              }

              window.sessionStorage.setItem(RETRY_KEY, 'true');
            } catch (error) {
              return;
            }

            window.location.replace(window.location.href);
          },
          true
        );

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            try {
              window.sessionStorage.removeItem(RETRY_KEY);
            } catch (error) {
              // Ignore unavailable storage.
            }
          }, 5000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
